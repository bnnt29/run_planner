name: PyTest Framework - Python

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12.1"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libx11-6

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt5 numpy z3-solver pytest pytest-cov

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p pytest-results
          pytest --junitxml=pytest-results/results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-results/
